name: pincenez
description: TypeScript CLI that grades LLM outputs against YAML rubrics using an LLM judge
language: typescript
profiles: [base]

standards:
  tests:
    framework: vitest
    config: vitest.config.ts
    directory: tests
  linter:
    tool: eslint
    config: eslint.config.js
  coverage:
    config: vitest.config.ts
    ratchet_pattern: thresholds
