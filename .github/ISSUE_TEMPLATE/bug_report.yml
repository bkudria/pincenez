name: Bug report
description: Report a defect in pincenez
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the fields below so we can reproduce and fix it.
        For security vulnerabilities, use [private vulnerability reporting](https://github.com/bkudria/pincenez/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
      placeholder: When I ran `pincenez checks.yaml output.md`, ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands and inputs. A small checks file + output snippet helps a lot.
      render: shell
    validations:
      required: true

  - type: input
    id: pincenez-version
    attributes:
      label: pincenez version
      description: Output of `pincenez --version`
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v24.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.1, Ubuntu 24.04, ...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, related issues, ...
